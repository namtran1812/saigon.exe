services:
  postgres:
    image: postgres:17
    container_name: saigon-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: saigon
      POSTGRES_PASSWORD: saigon
      POSTGRES_DB: saigon

    ports:
      - "5432:5432"

    volumes:
      - saigon_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saigon -d saigon"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: saigon-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  saigon_postgres_data:
